<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Rename category - Todo app</title>
	<link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header class="site-header">
	<nav aria-label="Main navigation"><a th:href="@{/}">Tasks</a> <a th:href="@{/categories}">Categories</a></nav>
</header>
<main class="container">
	<h1 class="page-header">Rename category</h1>
	<form class="card stack" method="post" th:action="@{/categories/{id}/edit(id=${categoryId})}" th:object="${categoryForm}">
		<p class="feedback error" role="alert" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
		<label for="name">Category name</label>
		<input type="text" id="name" th:field="*{name}" required
			   aria-describedby="name-help name-error" th:attr="aria-invalid=${#fields.hasErrors('name')}">
		<p id="name-help" class="hint">Names must be unique. Uncategorized is reserved for todos without a category.</p>
		<p id="name-error" class="field-error" role="alert" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
		<div class="actions"><button type="submit">Save name</button> <a th:href="@{/categories}">Cancel</a></div>
	</form>
</main>
</body>
</html>
