<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Delete task | Todo</title>
	<link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><nav aria-label="Main navigation"><a th:href="@{/}">Tasks</a><a th:href="@{/categories}">Categories</a></nav></header>
<main id="main" class="container narrow">
	<div class="page-header"><h1>Delete task?</h1></div>
	<p th:if="${error}" class="feedback error" role="alert" th:text="${error}"></p>
	<section class="card stack" aria-label="Confirm task deletion">
		<p>Permanently delete <strong th:text="${todo.name}"></strong>? This cannot be undone.</p>
		<form class="actions" method="post" th:action="@{/todos/{id}/delete(id=${todo.id})}">
			<button class="danger" type="submit" name="confirmed" value="true">Yes, delete task</button>
			<a th:href="@{/}">Cancel</a>
		</form>
	</section>
</main>
</body>
</html>
