<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title + ' | Todo'}"></title>
	<link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><nav aria-label="Main navigation"><a th:href="@{/}">Tasks</a><a th:href="@{/categories}">Categories</a></nav></header>
<main id="main" class="container narrow">
	<div class="page-header"><h1 th:text="${title}"></h1></div>
	<div class="card stack"><p class="feedback error" role="alert" th:text="${error}"></p><a th:href="@{/}">Back to tasks</a></div>
</main>
</body>
</html>
